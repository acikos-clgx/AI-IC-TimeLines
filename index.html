<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Traffic Light Matrix</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    darkMode: 'class'
};
</script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">

<!-- HEADER -->
<header class="border-b bg-white border-slate-200 dark:bg-slate-900/50 dark:border-slate-800 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

<div>
<h1 class="text-xl font-bold">AI Approval Matrix</h1>
<p class="text-xs text-slate-500 dark:text-slate-400">Compliance Timelines</p>
</div>

<button onclick="toggleTheme()" id="theme-toggle" class="p-2 border rounded">
</button>

</div>
</header>

<!-- MAIN -->
<main class="max-w-7xl mx-auto p-6">

<div id="tab-matrix">

<h2 class="text-lg font-bold mb-4">Governance Classifications</h2>

<div class="border rounded-xl overflow-hidden">
<div class="grid grid-cols-12 px-4 py-2 text-xs font-bold bg-slate-100 dark:bg-slate-800">
<div class="col-span-6">Scenario</div>
<div class="col-span-2 text-center text-emerald-500">Green</div>
<div class="col-span-2 text-center text-amber-500">Amber</div>
<div class="col-span-2 text-center text-rose-500">Red</div>
</div>

<div id="matrix-body"></div>
</div>

</div>

</main>

<!-- SCRIPT -->
<script>

const SCENARIO_DATA = [
{
id: "internal-approved",
title: "Internal Use Case (Approved)",
category: "Internal",
description: "Standard approved tools",
timelines: {
green: { duration: "1 week" },
amber: { duration: "2 weeks" },
red: { duration: "6 weeks" }
}
},
{
id: "internal-new",
title: "Internal + New Tool",
category: "Internal",
description: "New AI tools",
timelines: {
green: { duration: "N/A" },
amber: { duration: "4 weeks" },
red: { duration: "8 weeks" }
}
}
];

// STATE
let isDarkMode = true;

// THEME
function toggleTheme() {
    isDarkMode = !isDarkMode;
    document.documentElement.classList.toggle('dark', isDarkMode);
    renderThemeIcon();
}

function renderThemeIcon() {
    const btn = document.getElementById('theme-toggle');
    btn.innerText = isDarkMode ? "☀️" : "🌙";
}

// MATRIX RENDER
function renderMatrix() {
    const container = document.getElementById("matrix-body");

    container.innerHTML = SCENARIO_DATA.map(s => {

        return `
<div class="grid grid-cols-12 px-4 py-3 border-t">

<div class="col-span-6">
<div class="font-semibold">${s.title}</div>
<div class="text-xs text-slate-500">${s.description}</div>
</div>

<div class="col-span-2 text-center">${s.timelines.green.duration}</div>
<div class="col-span-2 text-center">${s.timelines.amber.duration}</div>
<div class="col-span-2 text-center">${s.timelines.red.duration}</div>

</div>
        `;

    }).join("");

}

// INIT
document.addEventListener("DOMContentLoaded", () => {
    renderThemeIcon();
    renderMatrix();
});

</script>
</body>
</html>
